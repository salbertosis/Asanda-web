<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Resultados | II Campeonato Preinfantil YMCAA jul 2026</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eaf0f7;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #172033;
      --muted: #526077;
      --brand: #075985;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      flex-direction: column;
    }

    .site-header {
      padding: 0.75rem clamp(1rem, 3vw, 2.5rem);
      background: linear-gradient(135deg, #075985, #0f766e);
      color: #ffffff;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: clamp(0.85rem, 2.5vw, 1.5rem);
    }

    .logo-frame {
      display: grid;
      width: clamp(7rem, 16vw, 11rem);
      flex: 0 0 auto;
      padding: 0.35rem;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.75rem;
      background: #000000;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    .club-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .header-copy { min-width: 0; }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.5vw, 1.75rem);
      line-height: 1.2;
    }

    .view-switcher {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .viewer {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 1rem;
      min-height: 32rem;
      padding: 1rem;
      flex: 1;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface);
    }

    @media (max-width: 760px) {
      html, body {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
      }

      body { overflow: hidden; }

      .site-header {
        flex: 0 0 auto;
        padding-block: 0.65rem;
      }

      .logo-frame { width: clamp(5.5rem, 25vw, 7.5rem); }

      .view-switcher {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        flex: 0 0 auto;
        padding: 0.65rem 0.75rem 0;
      }

      .view-switcher button {
        min-height: 2.75rem;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--brand);
        border-radius: 0.65rem;
        background: var(--surface);
        color: var(--brand);
        font: 750 0.95rem system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }

      .view-switcher button[aria-pressed="true"] {
        background: var(--brand);
        color: #ffffff;
      }

      .view-switcher button:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 2px;
      }

      .viewer {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        padding: 0.75rem;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .panel { min-height: 0; }

      body[data-mobile-view="events"] #results-panel,
      body[data-mobile-view="results"] #events-panel {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1220;
        --surface: #111827;
        --border: #334155;
        --text: #e5edf7;
        --muted: #a8b4c6;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
      }
    }
  </style>
</head>
    <body>
      <header class="site-header">
        <div class="header-inner">
          <div class="logo-frame">
            <img class="club-logo" src="ymca.jpeg" alt="Logo del equipo de natación YMCA Anaco">
          </div>
          <div class="header-copy">
            <h1>II Campeonato Preinfantil YMCAA jul 2026</h1>
          </div>
        </div>
      </header>

  <nav class="view-switcher" aria-label="Vista del visor">
    <button id="show-events" type="button" aria-pressed="true" aria-controls="events-panel">Eventos</button>
    <button id="show-results" type="button" aria-pressed="false" aria-controls="results-panel">Resultados</button>
  </nav>

  <main class="viewer" aria-label="Visor de resultados">
    <section id="events-panel" class="panel" aria-label="Navegación de eventos">
      <iframe id="events-frame" src="evtindex.htm" title="Lista y búsqueda de eventos"></iframe>
    </section>
    <section id="results-panel" class="panel" aria-label="Contenido de resultados">
      <iframe id="results-frame" name="main" src="main.htm" title="Resultados del evento seleccionado" tabindex="-1"></iframe>
    </section>
  </main>

  <p id="viewer-status" class="sr-only" aria-live="polite"></p>

  <script>
        (() => {
          const mobileQuery = window.matchMedia('(max-width: 760px)');
          const eventsFrame = document.getElementById('events-frame');
          const resultsFrame = document.getElementById('results-frame');
          const eventsButton = document.getElementById('show-events');
          const resultsButton = document.getElementById('show-results');
          const viewerStatus = document.getElementById('viewer-status');
          let focusResultsAfterLoad = false;

          const setView = (view) => {
            document.body.dataset.mobileView = view;
            eventsButton.setAttribute('aria-pressed', String(view === 'events'));
            resultsButton.setAttribute('aria-pressed', String(view === 'results'));
          };

          const focusEventSearch = () => {
            try {
              const search = eventsFrame.contentDocument?.getElementById('event-search');
              if (search) search.focus();
            } catch (error) {
              // Same-origin access can be unavailable in some hosting contexts.
            }
          };

          eventsButton.addEventListener('click', () => {
            setView('events');
            window.requestAnimationFrame(focusEventSearch);
          });

          resultsButton.addEventListener('click', () => {
            setView('results');
          });

          window.addEventListener('message', (event) => {
            const validOrigin = location.protocol === 'file:'
              ? event.origin === 'null'
              : (location.protocol === 'http:' || location.protocol === 'https:') && event.origin === location.origin;

            if (
              event.source !== eventsFrame.contentWindow
              || !event.data
              || event.data.type !== 'asanda:event-selected'
              || !validOrigin
            ) return;

            if (mobileQuery.matches) {
              focusResultsAfterLoad = true;
              viewerStatus.textContent = '';
              setView('results');
            }
          });

          const applyLegacyStyles = () => {
        try {
          const doc = resultsFrame.contentDocument;
          if (!doc || !doc.head || !doc.body) return;

          if (!doc.querySelector('meta[name="viewport"]')) {
            const viewport = doc.createElement('meta');
            viewport.name = 'viewport';
            viewport.content = 'width=device-width, initial-scale=1';
            doc.head.appendChild(viewport);
          }

          if (doc.getElementById('asanda-result-styles')) return;

          const style = doc.createElement('style');
          style.id = 'asanda-result-styles';
          style.textContent = `
            :root { color-scheme: light dark; }
            * { box-sizing: border-box; }
            html { min-width: 0; }
            body {
              margin: 0;
              min-width: 0;
              padding: clamp(1rem, 3vw, 2rem);
              overflow-x: auto;
              background: #ffffff;
              color: #172033;
              font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              line-height: 1.5;
            }
            pre {
              width: max-content;
              min-width: 100%;
              margin: 0;
              padding: clamp(1rem, 3vw, 1.75rem);
              border: 1px solid #d5dee9;
              border-radius: 0.75rem;
              background: #f8fafc;
              color: #172033;
              font: 0.875rem/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
              tab-size: 4;
            }
            form { margin: 0 0 1rem; }
            input[type="button"], input[type="submit"], button {
              min-height: 2.75rem;
              padding: 0.65rem 1rem;
              border: 1px solid #075985;
              border-radius: 0.55rem;
              background: #075985;
              color: #ffffff;
              font: 700 0.95rem system-ui, sans-serif;
              cursor: pointer;
            }
            input[type="button"]:focus-visible,
            input[type="submit"]:focus-visible,
            button:focus-visible {
              outline: 3px solid #f59e0b;
              outline-offset: 2px;
            }
            @media (prefers-color-scheme: dark) {
              body { background: #111827; color: #e5edf7; }
              pre { border-color: #334155; background: #0b1220; color: #e5edf7; }
              input[type="button"], input[type="submit"], button {
                border-color: #38bdf8;
                background: #0c4a6e;
              }
            }
          `;
          doc.head.appendChild(style);
        } catch (error) {
          // Same-origin access can be unavailable in some hosting contexts.
        }
      };

          resultsFrame.addEventListener('load', () => {
            applyLegacyStyles();

            if (!focusResultsAfterLoad) return;
            focusResultsAfterLoad = false;
            if (!mobileQuery.matches) return;

            resultsFrame.focus();
            viewerStatus.textContent = 'Mostrando resultados del evento seleccionado.';
          });

          setView('events');
        })();
  </script>
</body>
</html>
