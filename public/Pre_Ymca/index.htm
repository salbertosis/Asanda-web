<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Resultados | II Campeonato Preinfantil YMCAA jul 2026</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eaf0f7;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #172033;
      --muted: #526077;
      --brand: #075985;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      flex-direction: column;
    }

    .site-header {
      padding: 0.75rem clamp(1rem, 3vw, 2.5rem);
      background: linear-gradient(135deg, #075985, #0f766e);
      color: #ffffff;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: clamp(0.85rem, 2.5vw, 1.5rem);
    }

    .logo-frame {
      display: grid;
      width: clamp(7rem, 16vw, 11rem);
      flex: 0 0 auto;
      padding: 0.35rem;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.75rem;
      background: #000000;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    .club-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .header-copy { min-width: 0; }

    .site-header p {
      margin: 0 0 0.25rem;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.88;
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.5vw, 1.75rem);
      line-height: 1.2;
    }

    .viewer {
      display: grid;
      grid-template-columns: minmax(18rem, 24rem) minmax(0, 1fr);
      gap: 1rem;
      min-height: 32rem;
      padding: 1rem;
      flex: 1;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface);
    }

    @media (max-width: 760px) {
      .site-header { padding-block: 0.65rem; }

      .logo-frame { width: clamp(5.5rem, 25vw, 7.5rem); }

      .viewer {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(22rem, 48vh) minmax(32rem, 70vh);
        min-height: 0;
        padding: 0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1220;
        --surface: #111827;
        --border: #334155;
        --text: #e5edf7;
        --muted: #a8b4c6;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
      }
    }
  </style>
</head>
    <body>
      <header class="site-header">
        <div class="header-inner">
          <div class="logo-frame">
            <img class="club-logo" src="ymca.jpeg" alt="Logo del equipo de natación YMCA Anaco">
          </div>
          <div class="header-copy">
            <p>Resultados de natación</p>
            <h1>II Campeonato Preinfantil YMCAA jul 2026</h1>
          </div>
        </div>
      </header>

  <main class="viewer" aria-label="Visor de resultados">
    <section class="panel" aria-label="Navegación de eventos">
      <iframe src="evtindex.htm" title="Lista y búsqueda de eventos"></iframe>
    </section>
    <section class="panel" aria-label="Contenido de resultados">
      <iframe id="results-frame" name="main" src="main.htm" title="Resultados del evento seleccionado"></iframe>
    </section>
  </main>

  <script>
    (() => {
      const resultsFrame = document.getElementById('results-frame');

      const applyLegacyStyles = () => {
        try {
          const doc = resultsFrame.contentDocument;
          if (!doc || !doc.head || !doc.body) return;

          if (!doc.querySelector('meta[name="viewport"]')) {
            const viewport = doc.createElement('meta');
            viewport.name = 'viewport';
            viewport.content = 'width=device-width, initial-scale=1';
            doc.head.appendChild(viewport);
          }

          if (doc.getElementById('asanda-result-styles')) return;

          const style = doc.createElement('style');
          style.id = 'asanda-result-styles';
          style.textContent = `
            :root { color-scheme: light dark; }
            * { box-sizing: border-box; }
            html { min-width: 0; }
            body {
              margin: 0;
              min-width: 0;
              padding: clamp(1rem, 3vw, 2rem);
              overflow-x: auto;
              background: #ffffff;
              color: #172033;
              font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              line-height: 1.5;
            }
            pre {
              width: max-content;
              min-width: 100%;
              margin: 0;
              padding: clamp(1rem, 3vw, 1.75rem);
              border: 1px solid #d5dee9;
              border-radius: 0.75rem;
              background: #f8fafc;
              color: #172033;
              font: 0.875rem/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
              tab-size: 4;
            }
            form { margin: 0 0 1rem; }
            input[type="button"], input[type="submit"], button {
              min-height: 2.75rem;
              padding: 0.65rem 1rem;
              border: 1px solid #075985;
              border-radius: 0.55rem;
              background: #075985;
              color: #ffffff;
              font: 700 0.95rem system-ui, sans-serif;
              cursor: pointer;
            }
            input[type="button"]:focus-visible,
            input[type="submit"]:focus-visible,
            button:focus-visible {
              outline: 3px solid #f59e0b;
              outline-offset: 2px;
            }
            @media (prefers-color-scheme: dark) {
              body { background: #111827; color: #e5edf7; }
              pre { border-color: #334155; background: #0b1220; color: #e5edf7; }
              input[type="button"], input[type="submit"], button {
                border-color: #38bdf8;
                background: #0c4a6e;
              }
            }
          `;
          doc.head.appendChild(style);
        } catch (error) {
          // Same-origin access can be unavailable in some hosting contexts.
        }
      };

      resultsFrame.addEventListener('load', applyLegacyStyles);
    })();
  </script>
</body>
</html>
