<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>II Campeonato Preinfantil YMCAA jul 2026 | Resultados</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --surface: #f1f5f9;
      --border: #cbd5e1;
      --text: #172033;
      --muted: #526077;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      display: grid;
      place-items: center;
      margin: 0;
      padding: clamp(1rem, 5vw, 3rem);
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      text-align: center;
    }

    .logo-frame {
      width: min(100%, 18rem);
      margin: 0 auto 1.25rem;
      padding: 0.5rem;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 0.85rem;
      background: #000000;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
    }

    .club-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.5rem, 4vw, 2.15rem);
      line-height: 1.2;
    }

    p { margin: 0.5rem auto; }

    .hint { max-width: 34rem; color: var(--muted); }

    .notice {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --surface: #0b1220;
        --border: #334155;
        --text: #e5edf7;
        --muted: #a8b4c6;
        --accent: #0f766e;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-frame">
      <img class="club-logo" src="ymca.jpeg" alt="Logo del equipo de natación YMCA Anaco">
    </div>
    <h1>II Campeonato Preinfantil YMCAA jul 2026</h1>
    <p class="hint">Elige un evento en el panel de navegación para consultar su hoja de resultados. También puedes buscar por número, categoría o prueba.</p>
    <p class="notice">Los tiempos y resultados publicados son extraoficiales.</p>
  </main>
</body>
</html>
